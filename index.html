function parseCSV(text) {
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i+1] === '"') { cur += '"'; i++; }
      else if (c === '"') q = false;
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n") { row.push(cur); rows.push(row); row = []; cur = ""; }
    else if (c !== "\r") cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows;
}

async function fetchRows(url, keepHeader = false) {
  const res = await fetch(url + (url.includes("?") ? "&" : "?") + "t=" + Date.now());

function byHeader(rows) {
  const [head = [], ...data] = rows;
  const H = head.map(x => (x || "").replace(/\s+/g, "").toLowerCase());
  const cols = {};
  const colsOf = kw => cols[kw] ||= H.map((x, i) => x.includes(kw) ? i : -1).filter(i => i >= 0);
  const pick = (r, ...kws) => { for (const kw of kws) for (const i of colsOf(kw)) if (has(r[i])) return r[i].trim(); return ""; };
  return { data, pick };
}

    const { data, pick } = byHeader(rows);
    return data.map(r => {
      const c = collegeOf(pick(r, "단과대")), t = pick(r, "종류");
      return {
        date: cleanDate(r[0]), college: c, type: practiceOf(c, t), place: pick(r, "장소"), when: pick(r, "시기"),
        rating: toRating(pick(r, "별점")), body: pick(r, "후기내용", "내용"), tip: pick(r, "꿀팁"), nick: pick(r, "닉네임"),
      };
    }).filter(x => x.type && (has(x.body) || x.rating)).reverse();
  };
  // Elective 폼 (의치약 공통): 타임스탬프, 후기 종류, 과목명, 별점, 후기 내용, 꿀팁, 닉네임
  const electiveRows = rows => rows.filter(r => has(r[2])).map(r => ({
    date: cleanDate(r[0]), college: "공통", grade: "E", kind: kindOf(r[1]),
    subject: r[2].trim().replace(/\s+/g, " "), rating: toRating(r[3]), body: r[4], tip: r[5], nick: r[6],
  })).reverse();
  // 시험후기: 타임스탬프, 단과대, 종류, 시기, 난이도, 공부법, 후기, 꿀팁, 닉네임
  const examRows = rows => rows.filter(r => has(r[2])).map(r => ({
    date: cleanDate(r[0]), college: collegeOf(r[1]), type: /국/.test(r[2]) ? "국시" : "예비시험",
    when: r[3], diff: toRating(r[4]), study: r[5], review: r[6], tip: r[7], nick: r[8],
  })).reverse();
  // 홍보: 타임스탬프, 분류, 제목, 내용, 연락처
  const promoRows = rows => rows.map((r, i) => [r, i]).filter(([r]) => has(r[2]) || has(r[3])).map(([r, i]) => ({
    id: i, date: cleanDate(r[0]), cat: (r[1] || "기타").trim(), title: r[2], body: r[3], contact: r[4],
  })).reverse();
  // 정보: 타임스탬프, 제목, 내용, 링크, 사진, (고정) — 고정글 먼저, 나머지는 최신순
  const infoRows = rows => {
    const info = rows.map((r, i) => [r, i]).filter(([r]) => has(r[1])).map(([r, i]) => ({
      id: i, date: cleanDate(r[0]), title: r[1], body: r[2], link: r[3], pin: has(r[5]),
      photos: (r[4] || "").split(/[\s,]+/).filter(Boolean).map(photoURL),
    })).reverse();
    return [...info.filter(x => x.pin), ...info.filter(x => !x.pin)];
  };
  // 졸업생: 타임스탬프, 단과대, 졸업 연도, 분류, 제목, 내용, 연락처
  const gradRows = rows => rows.map((r, i) => [r, i]).filter(([r]) => has(r[4]) || has(r[5])).map(([r, i]) => ({
    id: i, date: cleanDate(r[0]), college: collegeOf(r[1]), year: (r[2] || "").trim(), cat: (r[3] || "기타").trim(),
    title: r[4], body: r[5], contact: r[6],
  })).reverse();

  // 실제 글 + (적을 때만) 예시 글
  reviews = [
    ...mix(gradeRows(lRows), gradeRows([REVIEW_HEADER, ...SAMPLE_LOWER])),
    ...mix(gradeRows(uRows), gradeRows([REVIEW_HEADER, ...SAMPLE_UPPER])),
    ...mix(electiveRows(eRows), electiveRows(SAMPLE_ELECTIVE)),
  ];
  practices = mix(practiceRows(prRows), practiceRows([PRACTICE_HEADER, ...SAMPLE_PRACTICE]));
  exams = mix(examRows(xRows), examRows(SAMPLE_EXAM));
  promos = mix(promoRows(pRows), promoRows(SAMPLE_PROMO));
  infos = mix(infoRows(iRows), infoRows(SAMPLE_INFO));
  grads = mix(gradRows(gRows), gradRows(SAMPLE_GRAD));
  loaded = true;
  route();
  // 이 기기에서 처음 들어왔을 때만 이용안내를 한 번 띄워요
  let seen = false;
  try { seen = localStorage.getItem("guideSeen") === "1"; localStorage.setItem("guideSeen", "1"); } catch (e) { seen = true; }
  if (!seen) openGuide();
}

function withParams(base, params) {
  if (!base) return "#";
  if (!params.length) return base;
  return base + (base.includes("?") ? "&" : "?") + "usp=pp_url&" + params.join("&");
}
const KIND_LABEL = { R: "수강후기", E: "Exam", M: "Midterm", C: "Competition", F: "졸업시험" };
const isLower = g => typeof g === "number" && g <= 3;
const kindsFor = g => isLower(g) ? ["R", "E", "M", "C"] : ["R", "E"];
function formLink(g, subject, k = "R") {
  const enc = encodeURIComponent, params = [];
  const add = (entry, val) => { if (entry && val) params.push(entry + "=" + enc(val)); };
  if (g === "E") {
    add(ELECTIVE_KIND_ENTRY, KIND_LABEL[k]); add(ELECTIVE_SUBJECT_ENTRY, subject);
    return withParams(ELECTIVE_FORM_URL, params);
  }
  if (isLower(g)) {
    add(LOWER_COLLEGE_GRADE_ENTRY, college + " " + g + "학년"); add(LOWER_KIND_ENTRY, KIND_LABEL[k]);
    return withParams(LOWER_FORM_URL, params);
  }
  add(UPPER_COLLEGE_GRADE_ENTRY, college + " " + g + "학년"); add(UPPER_KIND_ENTRY, KIND_LABEL[k]);
  return withParams(UPPER_FORM_URL, params);
}

// ===== 국시 · 예비시험 후기 =====
function renderExam() {
  const list = exams.filter(x => x.college === college && x.type === examType);
  const block = (label, text) => has(text) ? `<span class="tag">${label}</span><p>${linkify(text)}</p>` : "";
  const dots = n => "●".repeat(Math.round(n)) + "○".repeat(5 - Math.round(n));
  const link = withParams(EXAM_FORM_URL, [
    EXAM_COLLEGE_ENTRY && EXAM_COLLEGE_ENTRY + "=" + encodeURIComponent(college),
    EXAM_TYPE_ENTRY && EXAM_TYPE_ENTRY + "=" + encodeURIComponent(examType),
  ].filter(Boolean));

  $app.innerHTML = `
    ${header()}
    ${collegeTabs()}
    <div class="two">${["예비시험","국시"].map(t =>
      `<button class="tab ${t === examType ? "on" : ""}" data-t="${t}">${t}</button>`).join("")}</div>
    ${honeyBanner()}
    <div class="list-top">
    ${list.length && !viewUnlocked() ? gateHTML(link) : list.map(x => `
      <div class="review">
        <div class="top">
          <span>${has(x.when) ? `<span class="pill">${esc(x.when)}</span>` : ""}</span>
          ${nickDate(x)}
        </div>
        ${x.diff ? `<div class="muted">난이도 <span class="diff">${dots(x.diff)}</span></div>` : ""}
        ${block("공부 방법", x.study)}${block("시험 후기", x.review)}${block("꿀팁", x.tip)}
      </div>`).join("") || `<p class="empty">아직 ${college} ${examType} 후기가 없어요<br>첫 후기를 남겨주세요!</p>`}
    </div>
    ${credit()}
    ${list.length && !viewUnlocked() ? "" : `<a class="btn fab" href="${esc(link)}" target="_blank">✏️ ${examType} 후기 쓰기</a>`}`;

  bindHeader(); bindGate(); bindColleges(renderExam);
  document.querySelectorAll(".two .tab").forEach(el => el.onclick = () => { examType = el.dataset.t; renderExam(); });
}

// ===== 홍보 게시판 =====
// ===== 게시판 공통: 목록은 제목만, 누르면 글 보기 =====
const promoPills = p => `${sampleBadge(p)}<span class="pill">${esc(p.cat)}</span>`;
const infoPills = x => `${sampleBadge(x)}${x.pin ? '<span class="pill">고정</span>' : ""}`;
const gradPills = p => `${sampleBadge(p)}<span class="pill">${esc(p.cat)}</span>${has(p.year) ? `<span class="muted">${esc(p.year.replace(/\D/g, "") || p.year)} 졸업</span>` : ""}`;
const BOARDS = {
  promo: { name: () => "홍보", list: () => promos, pills: promoPills },
  info:  { name: () => "정보", list: () => infos,  pills: infoPills },
  grad:  { name: () => college + " 졸업생", list: () => grads, pills: gradPills },
};
function postRows(kind, list, emptyMsg) {
  if (!list.length) return `<p class="empty">${emptyMsg}</p>`;
  return `<div class="rows list-top">${list.map(x => `
    <div class="row-item post-row ${x.pin ? "pin" : ""} ${x.sample ? "is-sample" : ""}" data-k="${kind}" data-id="${x.id}">
      <div>
        <div class="prow-meta">${BOARDS[kind].pills(x)}</div>
        <div class="name">${esc(x.title || "(제목 없음)")}</div>
        <div class="meta2">${esc(x.date)}</div>
      </div>
      <span class="chev">›</span>
    </div>`).join("")}</div>`;
}
function bindPostRows() {
  document.querySelectorAll(".post-row").forEach(el => el.onclick = () =>
    location.hash = "post=" + el.dataset.k + "&id=" + el.dataset.id);
}
function renderPost(kind, id) {
  const B = BOARDS[kind];
  const x = B.list().find(p => String(p.id) === String(id));
  view = kind;
  if (x && x.college) college = x.college;
  const back = `<button class="back" onclick="location.hash='v=${kind}'">← ${esc(B.name())} 게시판</button>`;
  if (!x) {
    $app.innerHTML = back + '<p class="empty">글을 찾을 수 없어요<br>지워졌거나 아직 불러오는 중이에요</p>';
    return;
  }
  const contactLine = kind === "info" ? (has(x.link) ? `<div class="contact">🔗 ${linkify(x.link)}</div>` : "")
    : (has(x.contact) ? `<div class="contact">연락처 · ${linkify(x.contact)}</div>` : "");
  $app.innerHTML = `
    ${back}
    <article class="post-detail ${x.sample ? "is-sample" : ""}">
      <div class="meta"><span class="prow-meta">${B.pills(x)}</span><span class="muted">${esc(x.date)}</span></div>
      <h1>${esc(x.title || "(제목 없음)")}</h1>
      ${has(x.body) ? `<p class="pd-body">${linkify(x.body)}</p>` : ""}
      ${x.photos && x.photos.length ? `<div class="photos">${x.photos.map(u =>
        `<a href="${esc(u)}" target="_blank"><img src="${esc(u)}" alt="" loading="lazy" onerror="this.parentNode.remove()"></a>`).join("")}</div>` : ""}
      ${contactLine}
    </article>`;
  window.scrollTo(0, 0);
}

function renderPromo() {
  const cats = ["전체", "동아리", "스터디", "과외", ...new Set(promos.map(p => p.cat).filter(c => !["동아리","스터디","과외"].includes(c)))];
  const list = promoCat === "전체" ? promos : promos.filter(p => p.cat === promoCat);

  $app.innerHTML = `
    ${header()}
    <div class="chips">${cats.map(c =>
      `<button class="tab ${c === promoCat ? "on" : ""}" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div>
    ${sampleNotice()}
    ${postRows("promo", list, "아직 홍보글이 없어요")}
    ${credit()}
    <a class="btn fab" href="${esc(PROMO_FORM_URL || "#")}" target="_blank">✏️ 홍보글 쓰기</a>`;

  bindHeader(); bindPostRows();
  document.querySelectorAll(".chips .tab").forEach(el => el.onclick = () => { promoCat = el.dataset.c; renderPromo(); });
}

// ===== 정보 게시판 =====
const driveLinks = () => DRIVE_LINKS.length ? `<div class="links">${DRIVE_LINKS.map(([label, url]) =>
  `<a class="drive" href="${esc(url || "#")}" target="_blank" rel="noopener">
    <span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>
    ${esc(label)}<span class="arrow">→</span></a>`).join("")}</div>` : "";

function renderInfo() {
  $app.innerHTML = `
    ${header()}
    ${sampleNotice()}
    ${postRows("info", infos, "아직 정보글이 없어요")}
    ${credit()}
    <a class="btn fab" href="${esc(INFO_FORM_URL || "#")}" target="_blank">✏️ 정보 공유하기</a>`;

  bindHeader(); bindPostRows();
}

// ===== 졸업생 게시판 =====
let gradCat = "전체";
function renderGrad() {
  const base = ["진로", "취업·병원", "기타"];
  const mine = grads.filter(p => p.college === college);
  const cats = ["전체", ...base, ...new Set(mine.map(p => p.cat).filter(c => !base.includes(c)))];
  const list = gradCat === "전체" ? mine : mine.filter(p => p.cat === gradCat);

  $app.innerHTML = `
    ${header()}
    ${collegeTabs()}
    <div class="chips">${cats.map(c =>
      `<button class="tab ${c === gradCat ? "on" : ""}" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div>
    ${sampleNotice()}
    ${postRows("grad", list, `아직 ${college} 졸업생 글이 없어요`)}
    ${credit()}
    <a class="btn fab" href="${esc(withParams(GRAD_FORM_URL, GRAD_COLLEGE_ENTRY ? [GRAD_COLLEGE_ENTRY + '=' + encodeURIComponent(college)] : []))}" target="_blank">✏️ 졸업생 글쓰기</a>`;

  bindHeader(); bindPostRows(); bindColleges(renderGrad);
  document.querySelectorAll(".chips .tab").forEach(el => el.onclick = () => { gradCat = el.dataset.c; renderGrad(); });
}

function route() {
  const m = location.hash.match(/^#(?:c=([^&]+)&)?g=(\d|E)&(?:k=([RMCEF])&)?s=(.+)$/);
  const v = location.hash.match(/^#v=(\w+)$/);
  const pp = location.hash.match(/^#post=(promo|info|grad)&id=(s?\d+)$/);
  if (pp) { renderPost(pp[1], pp[2]); return; }
  const gx = location.hash.match(/^#c=([^&]+)&gradexam$/);
  if (gx) {
    view = "subject";
    if (COLLEGES.includes(decodeURIComponent(gx[1]))) college = decodeURIComponent(gx[1]);
    renderGradExam(); return;
  }
  const pm = location.hash.match(/^#pc=([^&]+)&pt=(.+)$/);
  if (pm) {
    view = "practice";
    if (COLLEGES.includes(decodeURIComponent(pm[1]))) college = decodeURIComponent(pm[1]);
    renderPracticeDetail(decodeURIComponent(pm[2])); return;
  }
  if (m) {
    view = "subject";
    if (m[1] && COLLEGES.includes(decodeURIComponent(m[1]))) college = decodeURIComponent(m[1]);
    grade = m[2] === "E" ? "E" : Number(m[2]);
    if (m[3]) detailKind = { R: "R", M: "M", C: "C", E: "E", F: "F" }[m[3]] || "R";
    renderSubject(grade, decodeURIComponent(m[4])); return;
  }
  view = v ? v[1] : "subject";
  window.scrollTo(0, 0);
  if (view === "exam") renderExam();
  else if (view === "promo") renderPromo();
  else if (view === "info") renderInfo();
  else if (view === "grad") renderGrad();
  else if (view === "practice") renderPractice();
  else renderHome();
}
window.addEventListener("hashchange", () => { if (loaded) route(); });

// ===== 비밀번호 화면 =====
async function sha256(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}
// ===== 후기 열람코드 =====
function viewUnlocked() {
  try { return localStorage.getItem("viewUnlock") === VIEW_CODE_HASH; } catch (e) { return false; }
}
function gateHTML(writeLink) {
  return `<div class="gate">
    <div class="emoji">🔑</div>
    <h3>열람코드가 필요해요</h3>
    <p class="muted gate-desc"><span class="nb">과목 · 실습 · 국시·예비시험</span> <span class="nb">후기 중 하나만 작성해도</span> <span class="nb">공통 열람코드를 받을 수 있어요</span></p>
    <div class="row">
      <input class="search" id="vc" placeholder="열람코드" autocomplete="off">
      <button class="btn" id="vcgo">열기</button>
    </div>
    <div class="err" id="vcerr"></div>
    <a class="write" href="${esc(writeLink)}" target="_blank">후기 쓰고 코드 받기 →</a>
  </div>`;
}
function bindGate() {
  const input = document.getElementById("vc");
  if (!input) return;
  const tryIt = async () => {
    if (await sha256(input.value.normalize("NFC").replace(/\s+/g, "")) === VIEW_CODE_HASH) {
      try { localStorage.setItem("viewUnlock", VIEW_CODE_HASH); } catch (e) {}
      route();
    } else {
      document.getElementById("vcerr").textContent = "열람코드가 틀렸어요";
      input.value = ""; input.focus();
    }
  };
  document.getElementById("vcgo").onclick = tryIt;
  input.onkeydown = e => { if (e.key === "Enter") tryIt(); };
}

function remembered() {
  try { return localStorage.getItem("unlock") === PASSWORD_HASH; } catch (e) { return false; }
}
function showLock() {
  $app.innerHTML = `
    <div class="lock">
      <div class="emoji">🔒</div>
      ${titleHTML()}
      <p class="muted">비밀번호를 입력해 주세요</p>
      <input class="search" id="pw" type="password" placeholder="비밀번호" autocomplete="current-password">
      <button class="btn" id="go">입장하기</button>
      <div class="err" id="err"></div>
      ${credit(guideBtn())}
    </div>`;
  const pw = document.getElementById("pw");
  const tryIt = async () => {
    if (await sha256(pw.value.trim()) === PASSWORD_HASH) {
      try { localStorage.setItem("unlock", PASSWORD_HASH); } catch (e) {}
      $app.innerHTML = '<p class="muted">불러오는 중…</p>';
      load();
    } else {
      document.getElementById("err").textContent = "비밀번호가 틀렸어요";
      pw.value = ""; pw.focus();
    }
  };
  document.getElementById("go").onclick = tryIt;
  pw.onkeydown = e => { if (e.key === "Enter") tryIt(); };
  pw.focus();
}
remembered() ? load() : showLock();
</script>
